name: Design Library

on:
  workflow_dispatch:
    inputs:
      repo:
        description: GitHub repo URL of React components
        default: https://github.com/detonnate/reactSwissComponents
      examples:
        description: Optional examples file
        default: examples/swiss.examples.jsx

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - run: node src/cli.mjs "${{ inputs.repo }}" --out docs-out/library --examples "${{ inputs.examples }}"
      - uses: actions/upload-artifact@v4
        with:
          name: design-library
          path: docs-out/library
